name: Levels
on:
  schedule:
    # GitHub startet geplante Läufe oft verspätet (am 05.10. bei chico-levels 7 Std.) → mehrere Versuche, Script überspringt, wenn schon fertig
    - cron: "17 4 * * 1-5"
    - cron: "47 4 * * 1-5"
    - cron: "17 5 * * 1-5"
    - cron: "47 5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python levels.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TZ: Europe/Berlin
      - run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add levels
          git commit -m "Levels $(date +%F)" || echo "nichts neu"
          git push
