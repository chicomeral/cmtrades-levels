name: Levels
on:
  schedule:
    # Alle 10 Min. von 07:30 bis 08:20 DE (UTC-Zeiten für Sommer- und Winterzeit, das Script prüft die DE-Uhrzeit)
    - cron: "30,40,50 4,5 * * 1-5"
    - cron: "0,10,20 5,6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python levels.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TZ: Europe/Berlin
          EVENT: ${{ github.event_name }}
      - run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add levels
          git commit -m "Levels $(date +%F)" || echo "nichts neu"
          git push
